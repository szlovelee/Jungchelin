<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>정슐랭 회원가입</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .signup-form {
            width: 100%;
            max-width: 480px;
        }

        .brand-title {
            letter-spacing: -0.08em;
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <div class="d-flex justify-content-end">
            <a
                href="/login"
                class="btn btn-outline-secondary">
                로그인
            </a>
        </div>

        <h1 class="display-1 fw-bold text-center brand-title my-5">
            정슐랭
        </h1>

        <form
            method="POST"
            action="/signup"
            class="signup-form mx-auto"
        >

            {% if error and error_code != "ID_DUPLICATION" %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ error }}
                </div>
            {% endif %}


            <!-- 이름 -->
            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    이름
                </span>

                <input
                    type="text"
                    name="name"
                    class="form-control border-dark"
                    pattern="[가-힣]+"
                    placeholder="이름"
                    value="{{ form_data.name if form_data else '' }}"
                    required
                >
            </div>


            <!-- 소속, 기수, 번호 -->
            <div class="row g-2 mb-4">

                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-transparent fs-5">
                            소속
                        </span>

                        <select
                            name="track"
                            class="form-select border-dark"
                            required
                        >
                            <option value="">
                                선택
                            </option>

                            {% for track in track_type %}
                                <option
                                    value="{{ track }}"
                                    {% if form_data and track == form_data.track %}
                                        selected
                                    {% endif %}
                                >
                                    {{ track }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="col-md-3">
                    <input
                        type="number"
                        name="cohort"
                        class="form-control border-dark"
                        placeholder="기수"
                        min="1"
                        value="{{ form_data.cohort if form_data else '' }}"
                        required
                    >
                </div>

                <div class="col-md-4">
                    <input
                        type="number"
                        name="number"
                        class="form-control border-dark"
                        placeholder="번호"
                        min="1"
                        value="{{ form_data.number if form_data else '' }}"
                        required
                    >
                </div>

            </div>


            <!-- 아이디 -->
            <div class="mb-4">

                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent fs-5">
                        아이디
                    </span>

                    <input
                        type="text"
                        name="custom_id"
                        class="form-control border-dark"
                        pattern="[A-Za-z0-9]+"
                        minlength="6"
                        placeholder="영문과 숫자 6자 이상"
                        value="{{ form_data.custom_id if form_data else '' }}"
                        required
                    >
                </div>

                {% if error_code == "ID_DUPLICATION" %}
                    <div class="text-danger small mt-1 text-center w-100" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

            </div>


            <!-- 비밀번호 -->
            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    비밀번호
                </span>

                <input
                    type="password"
                    name="pw"
                    class="form-control border-dark"
                    pattern="[A-Za-z0-9!@#$%^&*]+"
                    minlength="9"
                    placeholder="비밀번호 9자 이상"
                    required
                >
            </div>


            <!-- 비밀번호 확인 -->
            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    비밀번호 확인
                </span>

                <input
                    type="password"
                    name="pw_confirm"
                    class="form-control border-dark"
                    minlength="9"
                    placeholder="비밀번호 확인"
                    required
                >
            </div>


            <div class="d-flex justify-content-center mt-5">
                <button
                    type="submit"
                    class="btn btn-outline-secondary btn-lg px-5"
                >
                    가입완료
                </button>
            </div>

        </form>
    </div>
</body>
</html>
