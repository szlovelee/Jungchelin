<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>정슐랭 회원가입</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <div class="container-fluid min-vh-100 py-5">

        <div class="d-flex justify-content-end">
            <a href="/login" class="btn btn-outline-secondary btn-lg">
                로그인
            </a>
        </div>

        <h1 class="display-1 fw-bold text-center mt-5 mb-5">
            정슐랭
        </h1>

        <form
            method="POST"
            action="/signup"
            class="row g-3 mx-auto col-12 col-md-8 col-lg-6"
        >
            <div class="col-12">
                <label class="form-label">이름</label>

                <input
                    type="text"
                    name="name"
                    class="form-control form-control-lg border-dark"
                    pattern="[가-힣]+"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">소속</label>

                <select
                    name="track"
                    class="form-select form-select-lg border-dark"
                    required
                >
                    <option value="">소속 선택</option>

                    {% for track in track_types %}
                        <option value="{{ track.name }}">
                            {{ track.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">기수</label>

                <input
                    type="number"
                    name="cohort"
                    class="form-control form-control-lg border-dark"
                    required
                >
            </div>

            <div class="col-md-3">
                <label class="form-label">번호</label>

                <input
                    type="number"
                    name="number"
                    class="form-control form-control-lg border-dark"
                    required
                >
            </div>

            <div class="col-12">
                <label class="form-label">아이디</label>

                <input
                    type="text"
                    name="custom_id"
                    class="form-control form-control-lg border-dark"
                    pattern="[A-Za-z0-9]+"
                    minlength="6"
                    required
                >
            </div>

            <div class="col-12">
                <label class="form-label">비밀번호</label>

                <input
                    type="password"
                    name="pw"
                    class="form-control form-control-lg border-dark"
                    minlength="9"
                    required
                >
            </div>

            <div class="col-12">
                <label class="form-label">비밀번호 확인</label>

                <input
                    type="password"
                    name="pw_confirm"
                    class="form-control form-control-lg border-dark"
                    minlength="9"
                    required
                >
            </div>

            {% if error %}
                <div class="col-12">
                    <p class="text-danger text-center">
                        {{ error }}
                    </p>
                </div>
            {% endif %}

            <div class="col-12 text-center mt-4">
                <button
                    type="submit"
                    class="btn btn-dark btn-lg px-5"
                >
                    가입완료
                </button>
            </div>
        </form>
    </div>
</body>
</html>
