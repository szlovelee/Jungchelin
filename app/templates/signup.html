<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>정슐랭 회원가입</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>
    <div class="container-fluid py-5">

        <div class="d-flex justify-content-end">
            <a href="/login" class="btn btn-outline-secondary btn-lg">
                로그인
            </a>
        </div>

        <h1 class="display-1 fw-bold text-center mt-5 mb-5">
            정슐랭
        </h1>

        <form method="POST" action="/signup" class="mx-auto signup-form">

            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    이름
                </span>

                <input
                    type="text"
                    name="name"
                    pattern="[가-힣]+"
                    class="form-control border-dark"
                    required
                >
            </div>

            <div class="row g-2 mb-4">

                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-transparent fs-5">
                            소속
                        </span>

                        <select
                            name="track"
                            class="form-select border-dark"
                            required
                        >
                            <option value="">선택</option>
                            <option value="코치">코치</option>
                            <option value="SW-AI랩">SW-AI랩</option>
                            <option value="게임랩">게임랩</option>
                            <option value="게임테크랩">게임테크랩</option>
                        </select>
                    </div>
                </div>

                <div class="col-md-3">
                    <input
                        type="number"
                        name="cohort"
                        class="form-control border-dark"
                        placeholder="기수"
                        required
                    >
                </div>

                <div class="col-md-4">
                    <input
                        type="number"
                        name="number"
                        class="form-control border-dark"
                        placeholder="번호"
                        required
                    >
                </div>

            </div>

            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    아이디
                </span>

                <input
                    type="text"
                    name="custom_id"
                    pattern="[A-Za-z0-9]+"
                    minlength="6"
                    class="form-control border-dark"
                    required
                >
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    비밀번호
                </span>

                <input
                    type="password"
                    name="pw"
                    pattern="[A-Za-z0-9!@#$%^&*]+"
                    minlength="9"
                    class="form-control border-dark"
                    required
                >
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-transparent fs-5">
                    비밀번호 확인
                </span>

                <input
                    type="password"
                    name="pw_confirm"
                    minlength="9"
                    class="form-control border-dark"
                    required
                >
            </div>

            {% if error %}
                <p class="text-danger text-center">
                    {{ error }}
                </p>
            {% endif %}

            <div class="d-flex justify-content-center mt-5">
                <button
                    type="submit"
                    class="btn btn-outline-secondary btn-lg px-5"
                >
                    가입완료
                </button>
            </div>

        </form>
    </div>
</body>
</html>
