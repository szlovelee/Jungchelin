<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>로그인 | 정슐랭</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-5">

        <div class="d-flex justify-content-end me-3">
            <a href="/signup"  class="btn btn-lg"  style="background-color: #03CC90; border-color: #03CC90; color: white;">
                회원가입
            </a>
        </div>

        <main class="login-container mx-auto">
            <div class="d-flex justify-content-center ms-3 mb-3">
            <img src="{{ url_for('static', filename='img/title.png') }}"width="400">
            </div>
            <div class="card shadow-sm border-0 bg-light p-4">

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <input type="text" name="custom_id" class="form-control form-control-lg" placeholder="아이디"
                            required>
                    </div>

                    <div class="mb-3">
                        <input type="password" name="pw" class="form-control form-control-lg" placeholder="비밀번호"
                            required>
                    </div>

                    {% if error %}
                    <p class="text-danger text-center">
                        {{ error }}
                    </p>
                    {% endif %}
                    

                    <button type="submit" class="login-btn login-btn-hover">
                        <div class="bold">로그인</div>
                    </button>
                </form>

                <p class="text-secondary text-center mt-4 mb-0">
                    처음 오셨나요?<br>
                    오른쪽 위 회원가입을 눌러주세요.
                </p>
            </div>
        </main>

    </div>
</body>

</html>
