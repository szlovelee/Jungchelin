<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>마이페이지 | 정슐랭</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>
    <div class="container-fluid py-4 px-4">

        <header class="d-flex justify-content-between align-items-center mb-5">
            <a href="/home" class="text-decoration-none text-dark">
                <h1 class="fw-bold">
                    정슐랭
                </h1>
            </a>

            <div class="d-flex gap-2">
                <a
                    href="/home"
                    class="btn btn-outline-secondary"
                >
                    홈으로
                </a>

                <form method="POST" action="/logout">
                    <button
                        type="submit"
                        class="btn btn-outline-secondary"
                    >
                        로그아웃
                    </button>
                </form>
            </div>
        </header>

        {% if request.args.get("error") %}
            <div class="alert alert-danger">
                요청을 처리하지 못했습니다.
            </div>
        {% endif %}

        <main class="row g-4">

            <!-- 사용자 정보 -->
            <section class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title mb-4">
                            내 정보
                        </h2>

                        <form method="POST" action="/mypage">

                            <div class="mb-3">
                                <label
                                    for="name"
                                    class="form-label"
                                >
                                    닉네임
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    class="form-control"
                                    value="{{ user.name }}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="track"
                                    class="form-label"
                                >
                                    소속
                                </label>

                                <select
                                    id="track"
                                    name="track"
                                    class="form-select"
                                    required
                                >
                                    {% for track in track_type %}
                                        <option
                                            value="{{ track.name }}"
                                            {% if track.name == user.track %}
                                                selected
                                            {% endif %}
                                        >
                                            {{ track.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col">
                                    <label
                                        for="cohort"
                                        class="form-label"
                                    >
                                        기수
                                    </label>

                                    <input
                                        type="number"
                                        id="cohort"
                                        name="cohort"
                                        class="form-control"
                                        value="{{ user.cohort }}"
                                        required
                                    >
                                </div>

                                <div class="col">
                                    <label
                                        for="number"
                                        class="form-label"
                                    >
                                        번호
                                    </label>

                                    <input
                                        type="number"
                                        id="number"
                                        name="number"
                                        class="form-control"
                                        value="{{ user.number }}"
                                        required
                                    >
                                </div>
                            </div>

                            <hr>

                            <div class="mb-3">
                                <label
                                    for="pw"
                                    class="form-label"
                                >
                                    새 비밀번호
                                </label>

                                <input
                                    type="password"
                                    id="pw"
                                    name="pw"
                                    class="form-control"
                                    minlength="9"
                                >
                            </div>

                            <div class="mb-4">
                                <label
                                    for="pw_confirm"
                                    class="form-label"
                                >
                                    새 비밀번호 확인
                                </label>

                                <input
                                    type="password"
                                    id="pw_confirm"
                                    name="pw_confirm"
                                    class="form-control"
                                    minlength="9"
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-dark w-100"
                            >
                                정보 수정
                            </button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- 내 리뷰 -->
            <section class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title mb-4">
                            내 리뷰 관리
                        </h2>

                        <div class="list-group">
                            {% for review in reviews %}
                                <div class="list-group-item">

                                    <div class="d-flex justify-content-between">
                                        <strong>
                                            {{ review.resto.name }}
                                        </strong>

                                        <span class="text-warning">
                                            ★ {{ review.star }}
                                        </span>
                                    </div>

                                    <p class="mt-2 mb-2">
                                        {{ review.comment }}
                                    </p>

                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="text-secondary">
                                            👍 {{ review.like or 0 }}
                                        </span>

                                        <div class="d-flex gap-2">
                                            <button
                                                type="button"
                                                class="btn btn-sm btn-outline-secondary"
                                                data-bs-toggle="collapse"
                                                data-bs-target="#editReview{{ review._id }}"
                                            >
                                                수정
                                            </button>

                                            <form
                                                method="POST"
                                                action="/reviews/{{ review._id }}/delete"
                                            >
                                                <button
                                                    type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                >
                                                    삭제
                                                </button>
                                            </form>
                                        </div>
                                    </div>

                                    <div
                                        id="editReview{{ review._id }}"
                                        class="collapse mt-3"
                                    >
                                        <form
                                            method="POST"
                                            action="/reviews/{{ review._id }}/edit"
                                            class="row g-2"
                                        >
                                            <div class="col-md-7">
                                                <input
                                                    type="text"
                                                    name="comment"
                                                    class="form-control"
                                                    value="{{ review.comment }}"
                                                    required
                                                >
                                            </div>

                                            <div class="col-md-3">
                                                <select
                                                    name="star"
                                                    class="form-select"
                                                    required
                                                >
                                                    {% for score in range(1, 6) %}
                                                        <option
                                                            value="{{ score }}"
                                                            {% if score == review.star %}
                                                                selected
                                                            {% endif %}
                                                        >
                                                            {{ score }}점
                                                        </option>
                                                    {% endfor %}
                                                </select>
                                            </div>

                                            <div class="col-md-2">
                                                <button
                                                    type="submit"
                                                    class="btn btn-dark w-100"
                                                >
                                                    저장
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                </div>
                            {% else %}
                                <div class="text-secondary">
                                    작성한 리뷰가 없습니다.
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
