<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>정슐랭 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <p class="fs-1 mt-3 ms-3">정슐랭</p>
    <div class="d-flex justify-content-end gap-3 mx-3 my-3">
        <div class="container-md w-50 border border-dark border-2 rounded "> <!-- 내 정보탭 -->
            <p class="fs-3 mt-3">닉네임</p>
            <input type="text"
                class="form-control border border-1 border-dark rounded p-2 bg-success bg-opacity-25 w-75 fs-3"
                value="{{ user.name }}">
            <div class="d-flex gap-2 w-75 mb-3 mt-3">
                <div class="flex-grow-1 input-group">
                    <span class="input-group-text border-0 fs-3 bg-transparent">소속</span>
                    <select class="form-select border-dark border-1 rounded bg-success bg-opacity-25" name="dept">
                        {% for d in depts %}
                        <option {% if d==user.track %}selected{% endif %}>{{ d }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex-grow-1 input-group">
                    <span class="input-group-text border-0 fs-3 bg-transparent">기수</span>
                    <input type="text" class="form-control bg-success bg-opacity-25 border-1 rounded p-2 border-dark"
                        value="{{ user.cohort }}">
                </div>
                <div class="flex-grow-1 input-group">
                    <span class="input-group-text border-0 fs-3 bg-transparent">번호</span>
                    <input type="text" class="form-control bg-success bg-opacity-25 border-1 rounded p-2 border-dark"
                        value="{{ user.number }}">
                </div>
                <!-- CSS에서 변경이 필요함 길이조절 등 -->
            </div>
            <div class="w-75 input-group mb-3">
                <span class="input-group-text border-0 bg-transparent fs-3">새 비밀번호</span>
                <input type="password" pattern="[A-Za-z0-9!@#$%^&*]+" minlength="9"
                    class="form-control border-1 rounded p-2 border-dark bg-success bg-opacity-25">
            </div>
            <div class="mt-3">
            </div>
            <div class="w-75 input-group mb-3 border-1 rounded p-2 border-dark">
                <span class="input-group-text border-0 bg-transparent fs-3">새 비밀번호 확인</span>
                <input type="password" class="form-control border-1 rounded p-2 border-dark bg-success bg-opacity-25">
            </div>
            <div class="mt-3 mb-3 text-center fs-3">
                <button type="submit"
                    class="btn btn-primary btn-lg bg-success bg-opacity-50 border border-dark border-1 fs-3">
                    변경
                </button>
            </div>
        </div>

        <div class="container-md w-50 border border-dark border-2 rounded "> <!-- 리뷰탭 -->
            <div class="mreview-wrap">
                <p class="fs-3 mt-3">내 리뷰관리</p>
                <!-- 리뷰 목록 -->
                <div class="mreview-list">
                    {% for review in reviews %}
                    <div class="mreview-item">
                        <div class="view-mode w-100">
                            <button type="button" class="btn btn-danger rounded-circle btn-circle">-</button>
                            <p class="fs-5">식당 이름</p>
                            <div class="mreview-comment">
                                {{ review.comment }}
                            </div>
                            <div class="mreview-rating">
                                ★ {{ review.star }}
                            </div>
                            <button type="button" class="btn btn-primary btn-circle"><i
                                    class=" bi-pencil-fill"></i></button>
                            <span class="text-muted">👍 {{ review.like }}</span>
                        </div>
                        <div class="edit-mode d-none w-100">
                            <p class="fs-5">식당 이름</p>
                            <div class="mreview-comment">
                                {{ review.comment }}
                            </div>
                            <div class="mreview-rating">
                                ★ {{ review.star }}
                            </div>
                            <button type="button" class="btn btn-success btn-circle"><i
                                    class="bi bi-check-lg"></i></button>>
                                <span class="text-muted">👍 {{ review.like }}</span>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
